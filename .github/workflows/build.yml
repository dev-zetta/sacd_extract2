name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends cmake gcc make

      - name: Configure
        run: >-
          cmake -S tools/sacd_extract -B build/release
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/release --parallel

      - name: Unit and smoke tests
        run: |
          ctest --test-dir build/release --output-on-failure
          build/release/sacd_extract --version
          build/release/sacd_extract --help
          if ldd build/release/sacd_extract | grep -q libxml; then
            echo "Unexpected libxml runtime dependency"
            exit 1
          fi

      - name: Package executable
        run: |
          mkdir -p build/package/sacd_extract
          install -m 0755 build/release/sacd_extract build/package/sacd_extract/
          install -m 0644 README.md CHANGELOG.md COPYING build/package/sacd_extract/
          tar -C build/package -czf build/sacd_extract-linux-x86_64.tar.gz sacd_extract
          cd build
          sha256sum sacd_extract-linux-x86_64.tar.gz > sacd_extract-linux-x86_64.tar.gz.sha256

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: sacd_extract-linux-x86_64
          path: |
            build/sacd_extract-linux-x86_64.tar.gz
            build/sacd_extract-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install MinGW-w64 build environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libiconv

      - name: Configure
        run: >-
          cmake -S tools/sacd_extract -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSACD_WINDOWS_STATIC=ON

      - name: Build
        run: cmake --build build/release --parallel

      - name: Unit and smoke tests
        run: |
          ctest --test-dir build/release --output-on-failure
          build/release/sacd_extract.exe --version
          build/release/sacd_extract.exe --help

      - name: Verify portable executable
        run: |
          objdump -p build/release/sacd_extract.exe > build/windows-imports.txt
          if grep -Ei 'DLL Name: (libiconv|libintl|libwinpthread|libgcc)' build/windows-imports.txt; then
            echo "Unexpected MinGW runtime dependency"
            exit 1
          fi

      - name: Package executable
        run: |
          mkdir -p build/package/sacd_extract
          cp build/release/sacd_extract.exe build/package/sacd_extract/
          cp README.md CHANGELOG.md COPYING build/package/sacd_extract/
          cd build/package
          cmake -E tar cf ../sacd_extract-windows-x86_64.zip --format=zip sacd_extract
          cd ..
          sha256sum sacd_extract-windows-x86_64.zip > sacd_extract-windows-x86_64.zip.sha256

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: sacd_extract-windows-x86_64
          path: |
            build/sacd_extract-windows-x86_64.zip
            build/sacd_extract-windows-x86_64.zip.sha256
          if-no-files-found: error

  sanitizers:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends cmake gcc make

      - name: Configure ASan and UBSan
        run: >-
          cmake -S tools/sacd_extract -B build/sanitizers
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build/sanitizers --parallel

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/sanitizers --output-on-failure

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - windows
      - sanitizers
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download tested executable
        uses: actions/download-artifact@v8
        with:
          name: sacd_extract-linux-x86_64
          path: build

      - name: Download tested Windows executable
        uses: actions/download-artifact@v8
        with:
          name: sacd_extract-windows-x86_64
          path: build

      - name: Attach tested binary to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              build/sacd_extract-linux-x86_64.tar.gz \
              build/sacd_extract-linux-x86_64.tar.gz.sha256 \
              build/sacd_extract-windows-x86_64.zip \
              build/sacd_extract-windows-x86_64.zip.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              build/sacd_extract-linux-x86_64.tar.gz \
              build/sacd_extract-linux-x86_64.tar.gz.sha256 \
              build/sacd_extract-windows-x86_64.zip \
              build/sacd_extract-windows-x86_64.zip.sha256 \
              --verify-tag --generate-notes --title "sacd_extract ${GITHUB_REF_NAME#v}"
          fi
