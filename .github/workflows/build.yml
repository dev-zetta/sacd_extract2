name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            cmake gcc make file libssl-dev libwebkit2gtk-4.1-dev \
            libxdo-dev librsvg2-dev patchelf pkg-config

      - name: Set up Rust for Tauri
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: Set up Node.js for GUI
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Build, test, and package
        run: scripts/build.sh --platform linux --build-dir build/release --package

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: sacd_extract-linux-x86_64
          path: |
            build/dist/sacd_extract-linux-x86_64.tar.gz
            build/dist/sacd_extract-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

      - name: Upload GUI
        uses: actions/upload-artifact@v7
        with:
          name: sacd-extract-gui-linux-x86_64
          path: |
            build/dist/sacd-extract-gui-linux-x86_64.AppImage
            build/dist/sacd-extract-gui-linux-x86_64.AppImage.sha256
          if-no-files-found: error

  windows:
    if: github.ref_type != 'tag'
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install MinGW-w64 build environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            diffutils
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libiconv

      - name: Set up Node.js for GUI
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Set up Rust for Tauri
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: Build, test, and package
        run: scripts/build.sh --platform windows --build-dir build/release --package

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: sacd_extract-windows-x86_64
          path: |
            build/dist/sacd_extract-windows-x86_64.zip
            build/dist/sacd_extract-windows-x86_64.zip.sha256
          if-no-files-found: error

      - name: Upload GUI
        uses: actions/upload-artifact@v7
        with:
          name: sacd-extract-gui-windows-x86_64
          path: |
            build/dist/sacd-extract-gui-windows-x86_64-setup.exe
            build/dist/sacd-extract-gui-windows-x86_64-setup.exe.sha256
          if-no-files-found: error

  sanitizers:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends cmake gcc make

      - name: Build and test with ASan and UBSan
        run: >-
          scripts/build.sh --platform linux --build-dir build/sanitizers
          --build-type Debug --sanitizers --skip-gui

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download artifacts tested for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build.yml \
            --commit "$GITHUB_SHA" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "No successful branch build exists for $GITHUB_SHA"
            exit 1
          fi
          mkdir -p build
          for artifact in \
            sacd_extract-linux-x86_64 \
            sacd_extract-windows-x86_64 \
            sacd-extract-gui-linux-x86_64 \
            sacd-extract-gui-windows-x86_64
          do
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$artifact" \
              --dir build
          done

      - name: Attach tested binary to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              build/sacd_extract-linux-x86_64.tar.gz \
              build/sacd_extract-linux-x86_64.tar.gz.sha256 \
              build/sacd_extract-windows-x86_64.zip \
              build/sacd_extract-windows-x86_64.zip.sha256 \
              build/sacd-extract-gui-linux-x86_64.AppImage \
              build/sacd-extract-gui-linux-x86_64.AppImage.sha256 \
              build/sacd-extract-gui-windows-x86_64-setup.exe \
              build/sacd-extract-gui-windows-x86_64-setup.exe.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              build/sacd_extract-linux-x86_64.tar.gz \
              build/sacd_extract-linux-x86_64.tar.gz.sha256 \
              build/sacd_extract-windows-x86_64.zip \
              build/sacd_extract-windows-x86_64.zip.sha256 \
              build/sacd-extract-gui-linux-x86_64.AppImage \
              build/sacd-extract-gui-linux-x86_64.AppImage.sha256 \
              build/sacd-extract-gui-windows-x86_64-setup.exe \
              build/sacd-extract-gui-windows-x86_64-setup.exe.sha256 \
              --verify-tag --generate-notes --title "sacd_extract ${GITHUB_REF_NAME#v}"
          fi
