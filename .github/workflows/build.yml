name: Linux build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends cmake gcc make

      - name: Configure
        run: >-
          cmake -S tools/sacd_extract -B build/release
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/release --parallel

      - name: Unit and smoke tests
        run: |
          ctest --test-dir build/release --output-on-failure
          build/release/sacd_extract --version
          build/release/sacd_extract --help
          if ldd build/release/sacd_extract | grep -q libxml; then
            echo "Unexpected libxml runtime dependency"
            exit 1
          fi

      - name: Package executable
        run: |
          mkdir -p build/package/sacd_extract
          install -m 0755 build/release/sacd_extract build/package/sacd_extract/
          install -m 0644 README.md COPYING tools/sacd_extract/changelog build/package/sacd_extract/
          tar -C build/package -czf build/sacd_extract-linux-x86_64.tar.gz sacd_extract
          cd build
          sha256sum sacd_extract-linux-x86_64.tar.gz > sacd_extract-linux-x86_64.tar.gz.sha256

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: sacd_extract-linux-x86_64
          path: |
            build/sacd_extract-linux-x86_64.tar.gz
            build/sacd_extract-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  sanitizers:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends cmake gcc make

      - name: Configure ASan and UBSan
        run: >-
          cmake -S tools/sacd_extract -B build/sanitizers
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build/sanitizers --parallel

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/sanitizers --output-on-failure

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - sanitizers
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download tested executable
        uses: actions/download-artifact@v8
        with:
          name: sacd_extract-linux-x86_64
          path: build

      - name: Attach tested binary to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              build/sacd_extract-linux-x86_64.tar.gz \
              build/sacd_extract-linux-x86_64.tar.gz.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              build/sacd_extract-linux-x86_64.tar.gz \
              build/sacd_extract-linux-x86_64.tar.gz.sha256 \
              --verify-tag --generate-notes --title "sacd_extract ${GITHUB_REF_NAME#v}"
          fi
